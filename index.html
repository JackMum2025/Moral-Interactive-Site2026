<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Menaip Kosa Kata & Karangan Majlis Hari Jadi Tahun 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            gold: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fff8f9;
            background-image: radial-gradient(#ffe4e6 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .heading-font {
            font-family: 'Fredoka', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <div id="app" class="flex-grow flex flex-col max-w-4xl mx-auto w-full p-4 md:p-6">

        <!-- Name Input Screen Modal -->
        <div v-if="!isNameEntered" class="my-auto py-12 flex items-center justify-center">
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-rose-100 shadow-2xl max-w-md w-full text-center space-y-6">
                <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-slate-800 heading-font">Selamat Datang!</h2>
                    <p class="text-sm text-slate-500 mt-1">Sila masukkan nama anda sebelum memulakan Latihan Menaip Kosa Kata & Karangan Majlis Hari Jadi.</p>
                </div>
                <form @submit.prevent="masukAplikasi" class="space-y-4">
                    <div>
                        <input type="text" 
                               v-model="studentName" 
                               placeholder="Taip nama anda di sini..." 
                               class="w-full p-4 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 text-center font-semibold text-lg"
                               required />
                    </div>
                    <button type="submit" 
                            :disabled="!studentName.trim()"
                            :class="[
                                'w-full py-4 rounded-2xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-base',
                                studentName.trim() ? 'bg-rose-600 hover:bg-rose-700 cursor-pointer' : 'bg-slate-300 cursor-not-allowed opacity-60'
                            ]">
                        <span>Mula Latihan</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>

        <template v-else>
            <header class="bg-gradient-to-r from-rose-600 via-pink-600 to-amber-500 text-white rounded-3xl p-6 mb-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 opacity-15 text-9xl">
                    <i class="fa-solid fa-gifts"></i>
                </div>
                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-amber-300 text-rose-900 rounded-2xl flex items-center justify-center text-3xl shadow-lg font-bold border-2 border-amber-100 shrink-0">
                            <i class="fa-solid fa-cake-candles"></i>
                        </div>
                        <div>
                            <span class="bg-amber-300/30 text-amber-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">BM Tahun 5 • Penulisan Karangan</span>
                            <h1 class="text-2xl md:text-3xl font-bold heading-font text-white mt-1">Latihan Kosa Kata & Karangan Majlis Hari Jadi</h1>
                            <p class="text-rose-100 text-sm mt-0.5">Menaip kosa kata, ayat, dan melengkapkan perenggan karangan Bahasa Melayu</p>
                        </div>
                    </div>
                    <!-- Student Info Badge -->
                    <div class="bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/20 flex items-center gap-3 shrink-0">
                        <i class="fa-solid fa-id-card text-amber-300 text-xl"></i>
                        <div class="text-left">
                            <p class="text-xs text-rose-100 uppercase tracking-wider font-semibold">Nama Murid</p>
                            <p class="font-bold text-white text-sm md:text-base heading-font">{{ studentName }}</p>
                        </div>
                    </div>
                </div>
            </header>

            <main class="space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-3xl border border-rose-100 shadow-md">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                        <!-- Tab Bahagian 1 -->
                        <button @click="activeTab = 1" 
                                :class="[
                                    'p-3.5 rounded-2xl font-bold flex items-center justify-between transition border-2 text-left cursor-pointer',
                                    activeTab === 1 
                                        ? 'bg-rose-600 text-white border-rose-600 shadow-md' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                ]">
                            <div class="flex items-center gap-2.5">
                                <div :class="['w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs', activeTab === 1 ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-700']">
                                    1
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider opacity-80">Bahagian 1</p>
                                    <p class="text-xs md:text-sm heading-font">Kosa Kata</p>
                                </div>
                            </div>
                            <span :class="['text-[11px] font-semibold px-2 py-0.5 rounded-full', activeTab === 1 ? 'bg-white/20 text-white' : 'bg-rose-100 text-rose-700']">
                                {{ b1AnsweredCount }}/{{ items.length }}
                            </span>
                        </button>

                        <!-- Tab Bahagian 2 -->
                        <button @click="isB1Checked ? activeTab = 2 : null" 
                                :disabled="!isB1Checked"
                                :class="[
                                    'p-3.5 rounded-2xl font-bold flex items-center justify-between transition border-2 text-left',
                                    !isB1Checked ? 'opacity-50 cursor-not-allowed bg-slate-100 border-slate-200 text-slate-400' : 
                                    activeTab === 2 
                                        ? 'bg-amber-500 text-white border-amber-500 shadow-md cursor-pointer' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 cursor-pointer'
                                ]">
                            <div class="flex items-center gap-2.5">
                                <div :class="['w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs', activeTab === 2 && isB1Checked ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-800']">
                                    <i v-if="!isB1Checked" class="fa-solid fa-lock text-slate-400"></i>
                                    <span v-else>2</span>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider opacity-80">Bahagian 2</p>
                                    <p class="text-xs md:text-sm heading-font">Soalan Ayat</p>
                                </div>
                            </div>
                            <span :class="['text-[11px] font-semibold px-2 py-0.5 rounded-full', activeTab === 2 && isB1Checked ? 'bg-white/20 text-white' : 'bg-amber-100 text-amber-800']">
                                {{ b2AnsweredCount }}/{{ sentenceItems.length }}
                            </span>
                        </button>

                        <!-- Tab Bahagian 3 (Karangan) -->
                        <button @click="isB2Checked ? activeTab = 3 : null" 
                                :disabled="!isB2Checked"
                                :class="[
                                    'p-3.5 rounded-2xl font-bold flex items-center justify-between transition border-2 text-left',
                                    !isB2Checked ? 'opacity-50 cursor-not-allowed bg-slate-100 border-slate-200 text-slate-400' : 
                                    activeTab === 3 
                                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md cursor-pointer' 
                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 cursor-pointer'
                                ]">
                            <div class="flex items-center gap-2.5">
                                <div :class="['w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs', activeTab === 3 && isB2Checked ? 'bg-white/20 text-white' : 'bg-indigo-100 text-indigo-800']">
                                    <i v-if="!isB2Checked" class="fa-solid fa-lock text-slate-400"></i>
                                    <span v-else>3</span>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider opacity-80">Bahagian 3</p>
                                    <p class="text-xs md:text-sm heading-font">Perenggan Karangan</p>
                                </div>
                            </div>
                            <span :class="['text-[11px] font-semibold px-2 py-0.5 rounded-full', activeTab === 3 && isB2Checked ? 'bg-white/20 text-white' : 'bg-indigo-100 text-indigo-800']">
                                {{ b3AnsweredCount }}/{{ paragraphItems.length }}
                            </span>
                        </button>

                        <!-- Tab Keputusan & Sijil -->
                        <button v-if="isCompleted" 
                                @click="activeTab = 4" 
                                :class="[
                                    'p-3.5 rounded-2xl font-bold flex items-center justify-between transition border-2 text-left cursor-pointer',
                                    activeTab === 4 
                                        ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' 
                                        : 'bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100'
                                ]">
                            <div class="flex items-center gap-2.5">
                                <div :class="['w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs', activeTab === 4 ? 'bg-white/20 text-white' : 'bg-emerald-200 text-emerald-900']">
                                    <i class="fa-solid fa-award"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider opacity-80">Keputusan</p>
                                    <p class="text-xs md:text-sm heading-font">Sijil Penyertaan</p>
                                </div>
                            </div>
                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-200 text-emerald-900">
                                Selesai
                            </span>
                        </button>
                    </div>

                    <!-- Bahagian 1: Latihan Kosa Kata -->
                    <div v-show="activeTab === 1" class="space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-2">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800 heading-font flex items-center gap-2">
                                    <i class="fa-solid fa-pen-nib text-rose-600"></i>
                                    Bahagian 1: Latihan Kosa Kata (Maksud Bahasa Cina)
                                </h2>
                                <p class="text-xs text-slate-500">Sila taipkan jawapan Bahasa Melayu berdasarkan maksud Bahasa Cina.</p>
                            </div>
                            <span class="text-xs font-semibold px-3 py-1 bg-rose-50 text-rose-700 rounded-full border border-rose-200 self-start sm:self-center">
                                10 Soalan Kosa Kata
                            </span>
                        </div>

                        <div class="space-y-5">
                            <div v-for="(item, index) in items" :key="index" class="p-4 rounded-2xl border transition"
                                 :class="{
                                     'bg-slate-50 border-slate-200': item.status === null,
                                     'bg-emerald-50 border-emerald-300': item.status === 'correct',
                                     'bg-amber-50 border-amber-300': item.status === 'partial',
                                     'bg-rose-50 border-rose-300': item.status === 'wrong'
                                 }">
                                
                                <!-- Question Header -->
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="w-7 h-7 bg-rose-100 text-rose-700 text-xs rounded-full flex items-center justify-center font-bold shrink-0">
                                        {{ index + 1 }}
                                    </span>
                                    <span class="font-bold text-rose-900 text-base md:text-lg heading-font">
                                        {{ item.zh }}
                                    </span>
                                </div>

                                <!-- Typing Input Area -->
                                <div class="mt-3">
                                    <input type="text" 
                                           v-model="item.userAnswer" 
                                           placeholder="Taip jawapan Bahasa Melayu di sini..."
                                           class="w-full p-3 md:p-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm md:text-base font-medium transition bg-white" />
                                </div>

                                <!-- Feedback Indicator -->
                                <div class="mt-2 flex flex-wrap items-center justify-end gap-2 text-xs">
                                    <span v-if="item.status === 'correct'" class="text-emerald-700 font-bold flex items-center gap-1">
                                        <i class="fa-solid fa-circle-check text-emerald-600"></i> Tepat sekali!
                                    </span>
                                    <span v-else-if="item.status === 'partial'" class="text-amber-700 font-bold flex flex-wrap items-center gap-1">
                                        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> Hampir tepat (Semak ejaan) — <span class="text-slate-700 font-bold">Jawapan betul: <span class="text-rose-700 underline">{{ item.targetAlt ? item.target + ' / ' + item.targetAlt : item.target }}</span></span>
                                    </span>
                                    <span v-else-if="item.status === 'wrong'" class="text-rose-700 font-bold flex flex-wrap items-center gap-1">
                                        <i class="fa-solid fa-circle-xmark text-rose-600"></i> Salah — <span class="text-slate-700 font-bold">Jawapan betul: <span class="text-rose-700 underline">{{ item.targetAlt ? item.target + ' / ' + item.targetAlt : item.target }}</span></span>
                                    </span>
                                </div>

                            </div>
                        </div>

                        <!-- Butang Berasingan: Semak Bahagian 1 & Teruskan ke Bahagian 2 -->
                        <div class="pt-4 flex flex-col sm:flex-row items-center justify-end gap-3">
                            <button @click="semakBahagian1" 
                                    :disabled="!isB1AllAnswered"
                                    :class="[
                                        'w-full sm:w-auto font-bold px-6 py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 shadow-md',
                                        isB1AllAnswered ? 'bg-rose-600 hover:bg-rose-700 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60'
                                    ]">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>Semak Bahagian 1</span>
                            </button>

                            <button @click="activeTab = 2" 
                                    :disabled="!isB1Checked"
                                    :class="[
                                        'w-full sm:w-auto font-bold px-6 py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 shadow-md',
                                        isB1Checked ? 'bg-amber-500 hover:bg-amber-600 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60'
                                    ]">
                                <span>Teruskan ke Bahagian 2</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Bahagian 2: Latihan Mengisi Tempat Kosong Dalam Ayat -->
                    <div v-show="activeTab === 2" class="space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-2">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800 heading-font flex items-center gap-2">
                                    <i class="fa-solid fa-file-lines text-rose-600"></i>
                                    Bahagian 2: Latihan Mengisi Tempat Kosong Dalam Ayat
                                </h2>
                                <p class="text-xs text-slate-500">Isi tempat kosong dalam ayat berikut dengan kosa kata yang betul.</p>
                            </div>
                            <span class="text-xs font-semibold px-3 py-1 bg-amber-50 text-amber-700 rounded-full border border-amber-200 self-start sm:self-center">
                                10 Soalan Ayat
                            </span>
                        </div>

                        <div class="space-y-5">
                            <div v-for="(sItem, index) in sentenceItems" :key="'s-'+index" class="p-4 rounded-2xl border transition"
                                 :class="{
                                     'bg-slate-50 border-slate-200': sItem.status === null,
                                     'bg-emerald-50 border-emerald-300': sItem.status === 'correct',
                                     'bg-amber-50 border-amber-300': sItem.status === 'partial',
                                     'bg-rose-50 border-rose-300': sItem.status === 'wrong'
                                 }">
                                
                                <!-- Question Header -->
                                <div class="flex items-start gap-2 mb-3">
                                    <span class="w-7 h-7 bg-amber-100 text-amber-800 text-xs rounded-full flex items-center justify-center font-bold shrink-0 mt-0.5">
                                        {{ index + 1 }}
                                    </span>
                                    <div class="text-slate-800 text-base md:text-lg leading-relaxed font-medium">
                                        <span>{{ sItem.sentenceBefore }}</span>
                                        <span class="inline-block px-2 py-0.5 mx-1 font-bold text-rose-700 bg-rose-100/60 rounded border border-rose-200 text-sm">
                                            _____ {{ sItem.zh }} _____
                                        </span>
                                        <span>{{ sItem.sentenceAfter }}</span>
                                    </div>
                                </div>

                                <!-- Typing Input Area -->
                                <div class="mt-2">
                                    <input type="text" 
                                           v-model="sItem.userAnswer" 
                                           placeholder="Taip jawapan untuk mengisi tempat kosong..."
                                           class="w-full p-3 md:p-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm md:text-base font-medium transition bg-white" />
                                </div>

                                <!-- Feedback Indicator -->
                                <div class="mt-2 flex flex-wrap items-center justify-end gap-2 text-xs">
                                    <span v-if="sItem.status === 'correct'" class="text-emerald-700 font-bold flex items-center gap-1">
                                        <i class="fa-solid fa-circle-check text-emerald-600"></i> Tepat sekali!
                                    </span>
                                    <span v-else-if="sItem.status === 'partial'" class="text-amber-700 font-bold flex flex-wrap items-center gap-1">
                                        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> Hampir tepat (Semak ejaan) — <span class="text-slate-700 font-bold">Jawapan betul: <span class="text-rose-700 underline">{{ sItem.targetAlt ? sItem.target + ' / ' + sItem.targetAlt : sItem.target }}</span></span>
                                    </span>
                                    <span v-else-if="sItem.status === 'wrong'" class="text-rose-700 font-bold flex flex-wrap items-center gap-1">
                                        <i class="fa-solid fa-circle-xmark text-rose-600"></i> Salah — <span class="text-slate-700 font-bold">Jawapan betul: <span class="text-rose-700 underline">{{ sItem.targetAlt ? sItem.target + ' / ' + sItem.targetAlt : sItem.target }}</span></span>
                                    </span>
                                </div>

                            </div>
                        </div>

                        <!-- Button Controls for Bahagian 2 -->
                        <div class="pt-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <button @click="activeTab = 1" class="w-full sm:w-auto bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-6 py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 cursor-pointer">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Kembali ke Bahagian 1</span>
                            </button>

                            <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
                                <button @click="semakBahagian2" 
                                        :disabled="!isB2AllAnswered"
                                        :class="[
                                            'w-full sm:w-auto font-bold px-6 py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 shadow-md',
                                            isB2AllAnswered ? 'bg-amber-600 hover:bg-amber-700 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60'
                                        ]">
                                    <i class="fa-solid fa-circle-check"></i>
                                    <span>Semak Bahagian 2</span>
                                </button>

                                <button @click="activeTab = 3" 
                                        :disabled="!isB2Checked"
                                        :class="[
                                            'w-full sm:w-auto font-bold px-6 py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 shadow-md',
                                            isB2Checked ? 'bg-indigo-600 hover:bg-indigo-700 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60'
                                        ]">
                                    <span>Teruskan ke Bahagian 3</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- BAHAGIAN 3: MELENGKAPKAN PERENGGAN KARANGAN MAJLIS HARI JADI -->
                    <div v-show="activeTab === 3" class="space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-2">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800 heading-font flex items-center gap-2">
                                    <i class="fa-solid fa-book-open text-indigo-600"></i>
                                    Bahagian 3: Melengkapkan Perenggan Karangan Majlis Hari Jadi
                                </h2>
                                <p class="text-xs text-slate-500">Baca perenggan karangan di bawah. Taip frasa / ayat yang betul ke dalam petak jawapan berpandukan Bank Pilihan Jawapan.</p>
                            </div>
                            <span class="text-xs font-semibold px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-200 self-start sm:self-center">
                                Perenggan Karangan (10 Tempat Kosong)
                            </span>
                        </div>

                        <!-- ESSAY PARAGRAPH CARD -->
                        <div class="p-6 md:p-8 bg-indigo-50/50 rounded-3xl border-2 border-indigo-100 shadow-sm leading-loose text-slate-800 space-y-6">
                            
                            <div class="text-center pb-3 border-b border-indigo-100">
                                <h3 class="text-lg md:text-xl font-bold heading-font text-indigo-900 uppercase tracking-wide">
                                    <i class="fa-solid fa-cake-candles text-amber-500 mr-2"></i>
                                    Karangan: Sambutan Majlis Hari Jadi Ali
                                </h3>
                            </div>

                            <div class="space-y-5 text-sm md:text-base">
                                <p class="indent-8 leading-relaxed">
                                    Pada hari Ahad yang lalu, Ali mengadakan majlis hari jadi untuk 
                                    
                                    <!-- Blank 1 -->
                                    <span class="inline-block my-1 mx-1">
                                        <span class="text-xs font-bold bg-indigo-200 text-indigo-900 px-2 py-0.5 rounded-full mr-1">(1)</span>
                                        <input type="text" v-model="paragraphItems[0].userAnswer" placeholder="Taip jawapan..." 
                                               class="px-3 py-1.5 border border-indigo-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-semibold text-rose-700 bg-white shadow-sm text-sm" />
                                    </span>
                                    
                                    hari lahirnya yang ke-11. Dia 

                                    <!-- Blank 2 -->
                                    <span class="inline-block my-1 mx-1">

                    return str
                        .toLowerCase()
                        .replace(/[^a-z0-9]/g, '') // Membuang simbol & ruang
                        .trim();
                },
                checkList(list) {
                    list.forEach(item => {
                        const userNorm = this.normalizeText(item.userAnswer);
                        const targetNorm = this.normalizeText(item.target);
                        const targetAltNorm = item.targetAlt ? this.normalizeText(item.targetAlt) : '';

                        if (!userNorm) {
                            item.status = 'wrong';
                        } else if (userNorm === targetNorm || (targetAltNorm && userNorm === targetAltNorm)) {
                            item.status = 'correct';
                        } else if (userNorm.length > 3 && (targetNorm.includes(userNorm) || userNorm.includes(targetNorm) || (targetAltNorm && targetAltNorm.includes(userNorm)))) {
                            item.status = 'partial';
                        } else {
                            item.status = 'wrong';
                        }
                    });
                },
                semakBahagian1() {
                    if (!this.isB1AllAnswered) return;
                    this.checkList(this.items);
                    this.isB1Checked = true;
                },
                semakBahagian2() {
                    if (!this.isB2AllAnswered) return;
                    this.checkList(this.sentenceItems);
                    this.isB2Checked = true;
                },
                semakBahagian3() {
                    if (!this.isB3AllAnswered) return;
                    this.checkList(this.paragraphItems);
                    this.isB3Checked = true;
                },
                janaSijil() {
                    if (!this.isB3Checked) return;
                    
                    const today = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    this.tarikhPenyelesaian = today.toLocaleDateString('ms-MY', options);
                    
                    this.isCompleted = true;
                    this.activeTab = 4; // Alih ke Tab Sijil & Keputusan secara automatik

                    // Muat turun sijil secara automatik selepas DOM selesai dirender
                    this.$nextTick(() => {
                        setTimeout(() => {
                            this.muatTurunSijil();
                        }, 600);
                    });
                },
                salinKeputusan() {
                    let resultText = `=== KEPUTUSAN LATIHAN HARI JADI (BM TAHUN 5) ===\n`;
                    resultText += `Nama Murid: ${this.studentName}\n`;
                    resultText += `Tarikh: ${this.tarikhPenyelesaian}\n\n`;

                    resultText += `[ Bahagian 1: Latihan Kosa Kata ]\n`;
                    this.items.forEach((item, idx) => {
                        const statusText = item.status === 'correct' ? '✓ BETUL' : (item.status === 'partial' ? '⚠ HAMPIR TEPAT' : '✗ SALAH');
                        resultText += `${idx + 1}. [${item.zh}] : ${item.userAnswer || '-'} (${statusText})\n`;
                    });

                    resultText += `\n[ Bahagian 2: Mengisi Tempat Kosong Dalam Ayat ]\n`;
                    this.sentenceItems.forEach((item, idx) => {
                        const statusText = item.status === 'correct' ? '✓ BETUL' : (item.status === 'partial' ? '⚠ HAMPIR TEPAT' : '✗ SALAH');
                        resultText += `${idx + 1}. [${item.zh}] : ${item.userAnswer || '-'} (${statusText})\n`;
                    });

                    resultText += `\n[ Bahagian 3: Perenggan Karangan ]\n`;
                    this.paragraphItems.forEach((item, idx) => {
                        const statusText = item.status === 'correct' ? '✓ BETUL' : (item.status === 'partial' ? '⚠ HAMPIR TEPAT' : '✗ SALAH');
                        resultText += `${idx + 1}. [Ruang ${idx + 1}] : ${item.userAnswer || '-'} (${statusText})\n`;
                    });

                    // Panggilan salin teks selamat menggunakan execCommand
                    const el = document.createElement('textarea');
                    el.value = resultText;
                    el.setAttribute('readonly', '');
                    el.style.position = 'absolute';
                    el.style.left = '-9999px';
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);

                    this.isCopied = true;
                    setTimeout(() => {
                        this.isCopied = false;
                    }, 3000);
                },
                muatTurunSijil() {
                    const element = document.getElementById('sijil-container');
                    if (!element) return;
                    
                    const opt = {
                        margin:       0.2,
                        filename:     `Sijil_Majlis_Hari_Jadi_${this.studentName.replace(/\s+/g, '_')}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { 
                            scale: 2, 
                            useCORS: true,
                            scrollY: 0,
                            scrollX: 0,
                            windowWidth: document.documentElement.offsetWidth
                        },
                        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(element).save();
                },
                resetForm() {
                    this.items.forEach(item => { item.userAnswer = ''; item.status = null; });
                    this.sentenceItems.forEach(item => { item.userAnswer = ''; item.status = null; });
                    this.paragraphItems.forEach(item => { item.userAnswer = ''; item.status = null; });
                    this.activeTab = 1;
                    this.isB1Checked = false;
                    this.isB2Checked = false;
                    this.isB3Checked = false;
                    this.isCompleted = false;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
