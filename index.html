<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kosa Kata Bahasa Melayu Tahun 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            min-height: 100vh;
        }
        .font-heading {
            font-family: 'Fredoka', cursive;
        }
        .card-bounce {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .correct-anim {
            animation: popSuccess 0.4s ease-out;
        }
        .wrong-anim {
            animation: shakeError 0.4s ease-in-out;
        }
        @keyframes popSuccess {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Certificate Print & View Styling */
        @media print {
            body * {
                visibility: hidden;
            }
            #certificate-modal, #certificate-modal * {
                visibility: visible;
            }
            #certificate-modal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: white !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased p-4 sm:p-6">

    <div class="max-w-3xl w-full mx-auto my-auto flex-grow flex flex-col justify-center">
        <!-- Main Application Card -->
        <div class="bg-white rounded-3xl shadow-xl border-4 border-indigo-100 overflow-hidden flex flex-col relative">
            
            <!-- Header Bar -->
            <header class="bg-indigo-600 text-white p-5 text-center relative overflow-hidden flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-indigo-500 rounded-full opacity-50"></div>
                <div class="absolute -left-6 -top-6 w-20 h-20 bg-indigo-400 rounded-full opacity-40"></div>
                <div class="text-left relative z-10 w-full sm:w-auto text-center sm:text-left">
                    <h1 class="font-heading text-xl sm:text-2xl font-bold tracking-wide">
                        <i class="fa-solid fa-graduation-cap mr-2"></i>Kosa Kata Bahasa Melayu (Tahun 6)
                    </h1>
                    <p class="text-indigo-100 text-xs mt-0.5 font-semibold">
                        Mari Belajar & Menguji Pemahaman Kosa Kata!
                    </p>
                </div>
                
                <!-- Student Info Badge in Header (Visible when logged in) -->
                <div id="student-badge-container" class="relative z-10 hidden">
                    <div class="bg-indigo-700/80 backdrop-blur border border-indigo-400/50 px-3.5 py-1.5 rounded-xl flex items-center gap-2 text-xs font-bold text-white shadow-sm">
                        <i class="fa-solid fa-user-graduate text-yellow-300"></i>
                        <span id="header-student-name">Nama Murid</span>
                        <button onclick="changeStudentName()" title="Tukar Nama / Log Keluar" class="ml-1 text-indigo-200 hover:text-white transition-colors">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Dynamic Content Container -->
            <main id="app-container" class="p-6 sm:p-8 flex-grow flex flex-col justify-center min-h-[420px]">
                <!-- Dynamic views will render here via JS -->
            </main>

            <!-- Footer -->
            <footer class="bg-slate-50 border-t border-slate-100 px-6 py-3 text-center text-slate-400 text-xs font-semibold">
                Sesuai untuk Murid Tahun 6 • Pembelajaran Interaktif
            </footer>
        </div>
    </div>

    <!-- Modal for Sijil Pencapaian -->
    <div id="certificate-modal-wrapper" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <!-- Content inserted dynamically -->
    </div>

    <script>
        // Vocabulary Dataset according to specifications
        const VOCAB_DATA = [
            { id: 1, word: 'cerah', meaning: '晴朗/亮', sentence: 'Cuaca pada hari ini sangat ________, jadi kami bercadang untuk pergi berkelah di pantai.' },
            { id: 2, word: 'menekan', meaning: '踩/按', sentence: 'Pemandu bas itu ________ pedal brek secara tiba-tiba apabila seekor kucing melintas.' },
            { id: 3, word: 'tergesa-gesa', meaning: '匆匆忙忙', sentence: 'Ali berjalan dengan ________ ke sekolah kerana dia sudah terlewat bangun pagi.' },
            { id: 4, word: 'teruja', meaning: '兴奋', sentence: 'Murid-murid berasa amat ________ apabila mendengar berita tentang lawatan ke Zoo Negara.' },
            { id: 5, word: 'mencuba', meaning: '尝试', sentence: 'Siti mahu ________ resipi kek yang baharu itu berpandukan buku masakan ibunya.' },
            { id: 6, word: 'tertib', meaning: '有秩序', sentence: 'Semua murid beratur dengan ________ semasa membeli makanan di kantin sekolah.' },
            { id: 7, word: 'berebut-rebut', meaning: '争先恐后', sentence: 'Kita tidak boleh ________ semasa menaiki bas demi keselamatan bersama.' },
            { id: 8, word: 'panik', meaning: '慌张', sentence: 'Orang ramai berasa ________ apabila mendengar siren kecemasan berbunyi di dalam pasar raya.' },
            { id: 9, word: 'menegur', meaning: '指责', sentence: 'Cikgu Lee ________ murid yang sengaja membuang sampah di luar tong sampah.' },
            { id: 10, word: 'menyedari', meaning: '意识', sentence: 'Aiman tidak ________ bahawa dompetnya telah terjatuh semasa berjalan di pasar malam.' }
        ];

        // Global State Variable
        const state = {
            studentName: '', // Holds logged in student name
            currentLevel: 0, // 0: Menu, 1: Level 1, 2: Level 2, 3: Level 3
            questionIndex: 0,
            questions: [],
            score: 0,
            levelScores: { 1: null, 2: null, 3: null },
            isAnswered: false
        };

        // DOM Element Reference
        const container = document.getElementById('app-container');

        // Utility to shuffle an array
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Student Name Entry Screen
        function renderLoginScreen() {
            document.getElementById('student-badge-container').classList.add('hidden');
            container.innerHTML = `
                <div class="text-center py-6 max-w-md mx-auto my-auto">
                    <div class="inline-block p-4 bg-indigo-50 text-indigo-600 rounded-full mb-4 card-bounce">
                        <i class="fa-solid fa-user-astronaut text-4xl sm:text-5xl"></i>
                    </div>
                    <h2 class="font-heading text-2xl sm:text-3xl font-bold text-slate-800 mb-2">Selamat Datang!</h2>
                    <p class="text-slate-600 text-sm mb-6 font-semibold">
                        Sila masukkan nama anda sebelum memulakan aktiviti pembelajaran kosa kata.
                    </p>

                    <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                        <div>
                            <label for="student-name-input" class="block text-left text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">
                                Nama Murid / 姓名
                            </label>
                            <input type="text" id="student-name-input" required autocomplete="off" placeholder="Contoh: Tan Ming Wei" 
                                value="${state.studentName}"
                                class="w-full text-center text-lg font-bold p-3.5 border-2 border-indigo-200 rounded-2xl focus:border-indigo-600 focus:outline-none transition-all shadow-sm"
                                autofocus />
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl text-base shadow-md transition-all flex items-center justify-center gap-2">
                            <span>Mula Belajar</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById('student-name-input');
            const name = input.value.trim();
            if (!name) return;

            state.studentName = name;
            document.getElementById('header-student-name').innerText = name;
            document.getElementById('student-badge-container').classList.remove('hidden');
            renderMainMenu();
        }

        function changeStudentName() {
            state.studentName = '';
            renderLoginScreen();
        }

        // Render standard navigation header for levels
        function renderProgressHeader(title, subtitle) {
            return `
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                    <div>
                        <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full mb-1">
                            ${title}
                        </span>
                        <p class="text-slate-500 text-xs sm:text-sm font-semibold">${subtitle}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="renderMainMenu()" class="text-xs font-bold text-slate-400 hover:text-indigo-600 transition-colors mr-2">
                            <i class="fa-solid fa-house mr-1"></i> Menu
                        </button>
                        <div class="text-xs font-bold text-slate-500">Soalan ${state.questionIndex + 1}/${state.questions.length}</div>
                        <div class="w-24 bg-slate-200 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${((state.questionIndex + 1) / state.questions.length) * 100}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Main Menu Screen
        function renderMainMenu() {
            const isAllCompleted = state.levelScores[1] !== null && state.levelScores[2] !== null && state.levelScores[3] !== null;

            container.innerHTML = `
                <div class="text-center py-2">
                    <div class="inline-block p-4 bg-indigo-50 text-indigo-600 rounded-full mb-3 card-bounce">
                        <i class="fa-solid fa-book-open text-4xl sm:text-5xl"></i>
                    </div>
                    <h2 class="font-heading text-2xl sm:text-3xl font-bold text-slate-800 mb-1">Pilih Cabaran Anda!</h2>
                    <p class="text-slate-600 text-xs sm:text-sm max-w-md mx-auto mb-6 font-semibold">
                        Hai <span class="text-indigo-600 font-bold">${state.studentName}</span>, sila pilih关卡 (Level) di bawah untuk memulakan latihan.
                    </p>

                    <div class="grid grid-cols-1 gap-3.5 max-w-lg mx-auto">
                        <!-- Level 1 Button -->
                        <button onclick="startLevel(1)" class="group flex items-center justify-between p-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-2xl shadow-md transition-all transform hover:-translate-y-0.5">
                            <div class="flex items-center gap-4 text-left">
                                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-lg font-bold font-heading">1</div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-base">第一关：选择题 (Pilihan Jawapan)</h3>
                                        ${state.levelScores[1] !== null ? `<span class="bg-white/20 text-xs px-2 py-0.5 rounded-full font-extrabold"><i class="fa-solid fa-check text-yellow-300 mr-1"></i>${state.levelScores[1]}/10</span>` : ''}
                                    </div>
                                    <p class="text-xs text-sky-100">看华文意思，选择正确的 Kosa Kata</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-lg transition-transform group-hover:translate-x-1"></i>
                        </button>

                        <!-- Level 2 Button -->
                        <button onclick="startLevel(2)" class="group flex items-center justify-between p-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-2xl shadow-md transition-all transform hover:-translate-y-0.5">
                            <div class="flex items-center gap-4 text-left">
                                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-lg font-bold font-heading">2</div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-base">第二关：拼写测试 (Ejaan Kosa Kata)</h3>
                                        ${state.levelScores[2] !== null ? `<span class="bg-white/20 text-xs px-2 py-0.5 rounded-full font-extrabold"><i class="fa-solid fa-check text-yellow-300 mr-1"></i>${state.levelScores[2]}/10</span>` : ''}
                                    </div>
                                    <p class="text-xs text-emerald-100">看华文意思，亲自打出正确的 Kosa Kata</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-lg transition-transform group-hover:translate-x-1"></i>
                        </button>

                        <!-- Level 3 Button -->
                        <button onclick="startLevel(3)" class="group flex items-center justify-between p-4 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white rounded-2xl shadow-md transition-all transform hover:-translate-y-0.5">
                            <div class="flex items-center gap-4 text-left">
                                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-lg font-bold font-heading">3</div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-base">第三关：句子填空 (Lengkapkan Ayat)</h3>
                                        ${state.levelScores[3] !== null ? `<span class="bg-white/20 text-xs px-2 py-0.5 rounded-full font-extrabold"><i class="fa-solid fa-check text-yellow-300 mr-1"></i>${state.levelScores[3]}/10</span>` : ''}
                                    </div>
                                    <p class="text-xs text-purple-100">根据国文句子 context 选出正确的 Kosa Kata</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-lg transition-transform group-hover:translate-x-1"></i>
                        </button>
                    </div>

                    <!-- Certificate Banner Button -->
                    <div class="mt-6 max-w-lg mx-auto">
                        ${isAllCompleted ? `
                            <button onclick="openCertificateModal()" class="w-full bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-3 border-2 border-yellow-200 animate-pulse">
                                <i class="fa-solid fa-award text-2xl text-yellow-100"></i>
                                <span class="text-base">Muat Turun Sijil Pencapaian (Selesai 3 Level)</span>
                            </button>
                        ` : `
                            <div class="p-3 bg-slate-100 rounded-2xl text-slate-400 text-xs font-semibold flex items-center justify-center gap-2 border border-slate-200">
                                <i class="fa-solid fa-lock"></i>
                                <span>Lengkapkan semua 3 Level untuk membuka <b>Sijil Pencapaian</b></span>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // Start a Level
        function startLevel(levelNum) {
            state.currentLevel = levelNum;
            state.questionIndex = 0;
            state.questions = shuffleArray(VOCAB_DATA);
            state.score = 0;
            state.isAnswered = false;

            if (levelNum === 1) renderLevel1();
            else if (levelNum === 2) renderLevel2();
            else if (levelNum === 3) renderLevel3();
        }

        // LEVEL 1: Chinese Meaning Prompt -> Choose Malay Word
        function renderLevel1() {
            const currentItem = state.questions[state.questionIndex];
            
            // Generate 4 distractor choices (1 correct + 3 random incorrect)
            const otherWords = VOCAB_DATA.filter(item => item.id !== currentItem.id);
            const shuffledOthers = shuffleArray(otherWords).slice(0, 3);
            const options = shuffleArray([currentItem, ...shuffledOthers]);

            container.innerHTML = `
                <div class="flex flex-col h-full">
                    ${renderProgressHeader('第一关：选择题', '根据华文意思，选择正确的国文词汇')}

                    <div class="text-center my-auto py-2">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Maksud / 华文意思</p>
                        <div class="bg-indigo-50 text-indigo-900 border-2 border-indigo-200 rounded-2xl p-6 mb-8 inline-block w-full max-w-md shadow-sm">
                            <h3 class="text-3xl font-bold font-heading">${currentItem.meaning}</h3>
                        </div>

                        <!-- Options Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-lg mx-auto" id="options-grid">
                            ${options.map(opt => `
                                <button onclick="checkLevel1('${opt.word}', '${currentItem.word}')" 
                                    class="option-btn border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 font-bold py-4 px-6 rounded-2xl text-lg text-slate-700 transition-all shadow-sm focus:outline-none flex items-center justify-between">
                                    <span>${opt.word}</span>
                                    <i class="fa-regular fa-circle text-slate-300"></i>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Feedback Banner -->
                        <div id="feedback-banner" class="mt-6 h-12 flex items-center justify-center font-bold text-lg rounded-xl opacity-0 transition-all"></div>
                    </div>
                </div>
            `;
        }

        function checkLevel1(selectedWord, correctWord) {
            if (state.isAnswered) return;
            state.isAnswered = true;

            const grid = document.getElementById('options-grid');
            const buttons = grid.querySelectorAll('button');
            const feedback = document.getElementById('feedback-banner');

            buttons.forEach(btn => {
                btn.disabled = true;
                const wordText = btn.querySelector('span').innerText;
                const icon = btn.querySelector('i');

                if (wordText === correctWord) {
                    btn.classList.remove('border-slate-200', 'hover:border-indigo-500', 'hover:bg-indigo-50');
                    btn.classList.add('border-emerald-500', 'bg-emerald-500', 'text-white', 'correct-anim');
                    icon.className = 'fa-solid fa-circle-check text-white';
                } else if (wordText === selectedWord && selectedWord !== correctWord) {
                    btn.classList.remove('border-slate-200', 'hover:border-indigo-500', 'hover:bg-indigo-50');
                    btn.classList.add('border-rose-500', 'bg-rose-500', 'text-white', 'wrong-anim');
                    icon.className = 'fa-solid fa-circle-xmark text-white';
                }
            });

            if (selectedWord === correctWord) {
                state.score++;
                feedback.className = "mt-6 py-2 px-4 flex items-center justify-center font-bold text-base rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-300 opacity-100";
                feedback.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> Betul! Jawapan yang tepat.';
            } else {
                feedback.className = "mt-6 py-2 px-4 flex items-center justify-center font-bold text-base rounded-xl bg-rose-100 text-rose-800 border border-rose-300 opacity-100";
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark mr-2"></i> Salah! Jawapan sebenar: <span class="underline ml-1">${correctWord}</span>`;
            }

            // Directly transition to next question after delay
            setTimeout(() => {
                state.questionIndex++;
                state.isAnswered = false;
                if (state.questionIndex < state.questions.length) {
                    renderLevel1();
                } else {
                    finishLevel();
                }
            }, 1200);
        }

        // LEVEL 2: Chinese Meaning -> Type Malay Word (No Hints)
        function renderLevel2() {
            const currentItem = state.questions[state.questionIndex];

            container.innerHTML = `
                <div class="flex flex-col h-full">
                    ${renderProgressHeader('第二关：拼写测试', '根据华文意思，亲自打出正确的 Kosa Kata（不可看提示）')}

                    <div class="text-center my-auto py-2">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Maksud / 华文意思</p>
                        <div class="bg-teal-50 text-teal-900 border-2 border-teal-200 rounded-2xl p-6 mb-6 inline-block w-full max-w-md shadow-sm">
                            <h3 class="text-3xl font-bold font-heading">${currentItem.meaning}</h3>
                        </div>

                        <!-- Typing Form -->
                        <form onsubmit="event.preventDefault(); checkLevel2('${currentItem.word}');" class="max-w-md mx-auto">
                            <div class="mb-4">
                                <input type="text" id="type-input" autocomplete="off" placeholder="Taip kosa kata di sini..." 
                                    class="w-full text-center text-xl font-bold p-4 border-2 border-slate-300 rounded-2xl focus:border-teal-500 focus:outline-none transition-all shadow-inner"
                                    autofocus />
                            </div>
                            <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-2xl text-lg shadow-md transition-all">
                                Hantar Jawapan <i class="fa-solid fa-paper-plane ml-2"></i>
                            </button>
                        </form>

                        <!-- Feedback Banner -->
                        <div id="feedback-banner" class="mt-6 min-h-[48px] flex items-center justify-center font-bold text-lg rounded-xl opacity-0 transition-all"></div>
                    </div>
                </div>
            `;

            // Auto-focus input
            setTimeout(() => {
                const input = document.getElementById('type-input');
                if (input) input.focus();
            }, 100);
        }

        function checkLevel2(correctWord) {
            if (state.isAnswered) return;

            const input = document.getElementById('type-input');
            const submitBtn = document.getElementById('submit-btn');
            const feedback = document.getElementById('feedback-banner');
            const userVal = input.value.trim().toLowerCase();

            if (!userVal) return;

            state.isAnswered = true;
            input.disabled = true;
            submitBtn.disabled = true;

            const isCorrect = (userVal === correctWord.toLowerCase());

            if (isCorrect) {
                state.score++;
                input.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                feedback.className = "mt-6 py-2 px-4 flex items-center justify-center font-bold text-base rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-300 opacity-100";
                feedback.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> Tepat sekali! Ejaan anda betul.';
            } else {
                input.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-800', 'wrong-anim');
                feedback.className = "mt-6 py-2 px-4 flex items-center justify-center font-bold text-base rounded-xl bg-rose-100 text-rose-800 border border-rose-300 opacity-100";
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark mr-2"></i> Salah! Jawapan betul ialah: <span class="underline ml-1">${correctWord}</span>`;
            }

            // Directly transition to next question after delay
            setTimeout(() => {
                state.questionIndex++;
                state.isAnswered = false;
                if (state.questionIndex < state.questions.length) {
                    renderLevel2();
                } else {
                    finishLevel();
                }
            }, 1400);
        }

        // LEVEL 3: Malay Sentence Completion -> Choose from 10 Vocab options (No Chinese meanings)
        function renderLevel3() {
            const currentItem = state.questions[state.questionIndex];
            
            // Generate all 10 vocabulary options in alphabetical order for neat display
            const options = [...VOCAB_DATA].sort((a, b) => a.word.localeCompare(b.word));

            // Format sentence replacing "________" with stylized blank
            const formattedSentence = currentItem.sentence.replace('________', `<span class="inline-block px-3 border-b-4 border-indigo-500 text-indigo-600 font-bold">________</span>`);

            container.innerHTML = `
                <div class="flex flex-col h-full">
                    ${renderProgressHeader('第三关：句子填空', 'Isi tempat kosong dengan kosa kata yang paling sesuai')}

                    <div class="my-auto py-2">
                        <!-- Sentence Display Card -->
                        <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-6 mb-6 text-center shadow-sm">
                            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Soalan Ayat</p>
                            <p class="text-xl sm:text-2xl font-semibold text-slate-800 leading-relaxed">
                                "${formattedSentence}"
                            </p>
                        </div>

                        <p class="text-xs font-bold text-slate-400 text-center uppercase tracking-wider mb-3">Pilih Kosa Kata Yang Betul:</p>

                        <!-- All 10 Choices Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 max-w-2xl mx-auto" id="vocab-bank">
                            ${options.map(opt => `
                                <button onclick="checkLevel3('${opt.word}', '${currentItem.word}')" 
                                    class="vocab-btn border-2 border-slate-200 hover:border-purple-500 hover:bg-purple-50 font-bold py-3 px-2 rounded-xl text-sm sm:text-base text-slate-700 transition-all shadow-sm focus:outline-none text-center">
                                    ${opt.word}
                                </button>
                            `).join('')}
                        </div>

                        <!-- Feedback Banner -->
                        <div id="feedback-banner" class="mt-6 min-h-[48px] flex items-center justify-center font-bold text-lg rounded-xl opacity-0 transition-all"></div>
                    </div>
                </div>
            `;
        }

        function checkLevel3(selectedWord, correctWord) {
            if (state.isAnswered) return;
            state.isAnswered = true;

            const bank = document.getElementById('vocab-bank');
            const buttons = bank.querySelectorAll('button');
            const feedback = document.getElementById('feedback-banner');

            buttons.forEach(btn => {
                btn.disabled = true;
                const wordText = btn.innerText.trim();

                if (wordText === correctWord) {
                    btn.className = 'border-2 border-emerald-500 bg-emerald-500 text-white font-bold py-3 px-2 rounded-xl text-sm sm:text-base text-center correct-anim';
                } else if (wordText === selectedWord && selectedWord !== correctWord) {
                    btn.className = 'border-2 border-rose-500 bg-rose-500 text-white font-bold py-3 px-2 rounded-xl text-sm sm:text-base text-center wrong-anim';
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            if (selectedWord === correctWord) {
                state.score++;
                feedback.className = "mt-6 py-2 px-4 flex items-center justify-center font-bold text-base rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-300 opacity-100";
                feedback.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> Syabas! Penggunaan kosa kata yang tepat.';
            } else {
                feedback.className = "mt-6 py-2 px-4 flex items-center justify-center font-bold text-base rounded-xl bg-rose-100 text-rose-800 border border-rose-300 opacity-100";
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark mr-2"></i> Salah! Jawapan sebenar: <span class="underline ml-1">${correctWord}</span>`;
            }

            // Directly transition to next question after delay
            setTimeout(() => {
                state.questionIndex++;
                state.isAnswered = false;
                if (state.questionIndex < state.questions.length) {
                    renderLevel3();
                } else {
                    finishLevel();
                }
            }, 1400);
        }

        // Finish Level & Display Score Summary Screen
        function finishLevel() {
            state.levelScores[state.currentLevel] = state.score;
            const total = state.questions.length;
            const percentage = Math.round((state.score / total) * 100);

            let trophyColor = "text-yellow-400";
            let badgeText = "Cemerlang!";
            if (percentage < 50) {
                trophyColor = "text-slate-400";
                badgeText = "Boleh Cuba Lagi!";
            } else if (percentage < 80) {
                trophyColor = "text-amber-500";
                badgeText = "Syabas & Baik!";
            }

            const isAllCompleted = state.levelScores[1] !== null && state.levelScores[2] !== null && state.levelScores[3] !== null;

            container.innerHTML = `
                <div class="text-center py-4">
                    <div class="inline-block p-4 bg-amber-50 rounded-full mb-3 card-bounce">
                        <i class="fa-solid fa-trophy text-5xl sm:text-6xl ${trophyColor}"></i>
                    </div>
                    
                    <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-extrabold rounded-full mb-2">
                        ${badgeText}
                    </span>

                    <h2 class="font-heading text-3xl font-bold text-slate-800 mb-1">Tahniah, ${state.studentName}!</h2>
                    <p class="text-slate-500 text-sm font-semibold mb-6">Anda telah menyelesaikan Level ${state.currentLevel}</p>

                    <!-- Score Card -->
                    <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 max-w-sm mx-auto mb-6 shadow-inner">
                        <div class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Skor Anda</div>
                        <div class="text-4xl font-extrabold text-indigo-600 mb-1">${state.score} / ${total}</div>
                        <div class="text-slate-500 text-xs font-bold">Ketepatan: ${percentage}%</div>
                    </div>

                    <!-- Certificate Button (if all completed) -->
                    ${isAllCompleted ? `
                        <div class="mb-6 max-w-md mx-auto">
                            <button onclick="openCertificateModal()" class="w-full bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-700 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 border-2 border-yellow-200">
                                <i class="fa-solid fa-award text-2xl"></i>
                                <span>Muat Turun Sijil Pencapaian (Selesai Semua Level)</span>
                            </button>
                        </div>
                    ` : ''}

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row justify-center gap-3 max-w-md mx-auto">
                        <button onclick="startLevel(${state.currentLevel})" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3.5 px-5 rounded-2xl transition-all text-sm">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Cuba Lagi
                        </button>

                        ${state.currentLevel < 3 ? `
                            <button onclick="startLevel(${state.currentLevel + 1})" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-5 rounded-2xl transition-all shadow-md text-sm">
                                Terus ke Level ${state.currentLevel + 1} <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        ` : `
                            <button onclick="renderMainMenu()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-5 rounded-2xl transition-all shadow-md text-sm">
                                Kembali ke Menu <i class="fa-solid fa-house ml-2"></i>
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        // Sijil Pencapaian Modal Functions
        function openCertificateModal() {
            const modal = document.getElementById('certificate-modal-wrapper');
            const totalScore = (state.levelScores[1] || 0) + (state.levelScores[2] || 0) + (state.levelScores[3] || 0);
            const totalPct = Math.round((totalScore / 30) * 100);
            
            const today = new Date();
            const dateStr = today.toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' });

            modal.innerHTML = `
                <div id="certificate-modal" class="bg-white rounded-3xl shadow-2xl border-8 border-amber-400 max-w-2xl w-full p-6 sm:p-10 text-center relative overflow-hidden my-auto">
                    <!-- Ornamental Corner Decorations -->
                    <div class="absolute -top-12 -left-12 w-28 h-28 bg-amber-400 rounded-full opacity-20"></div>
                    <div class="absolute -bottom-12 -right-12 w-28 h-28 bg-amber-400 rounded-full opacity-20"></div>

                    <!-- Close & Action Bar -->
                    <div class="no-print flex flex-wrap justify-between items-center gap-2 mb-6 border-b pb-4">
                        <button onclick="closeCertificateModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm flex items-center gap-1">
                            <i class="fa-solid fa-arrow-left"></i> Kembali
                        </button>
                        <div class="flex items-center gap-2">
                            <button id="btn-download-png" onclick="downloadCertificatePNG()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-2 shadow-md transition-all">
                                <i class="fa-solid fa-file-image text-base"></i> Muat Turun PNG
                            </button>
                        </div>
                    </div>

                    <!-- Certificate Content Frame -->
                    <div id="certificate-print-area" class="border-4 border-amber-400 p-6 sm:p-8 rounded-2xl bg-amber-50/40 text-center relative" style="background-color: #fffdf5; border-style: double; border-width: 6px;">
                        <div class="flex justify-center mb-2">
                            <i class="fa-solid fa-award text-5xl sm:text-6xl text-amber-500"></i>
                        </div>
                        
                        <h2 class="font-heading text-xl sm:text-2xl font-bold tracking-widest text-amber-800 uppercase">SIJIL PENCAPAIAN</h2>
                        <p class="text-xs text-amber-600 font-semibold uppercase tracking-wider mb-4">Kosa Kata Bahasa Melayu (Tahun 6)</p>

                        <p class="text-xs text-slate-500 font-semibold">Dengan ini disahkan bahawa</p>
                        
                        <!-- Student Name -->
                        <h3 class="text-2xl sm:text-3xl font-extrabold text-indigo-900 my-2 font-heading border-b-2 border-indigo-200 inline-block px-8 py-1">
                            ${state.studentName}
                        </h3>

                        <p class="text-xs text-slate-600 max-w-md mx-auto mt-3 font-semibold leading-relaxed">
                            Telah berjaya menyelesaikan kesemua 3 Level Cabaran Kosa Kata Bahasa Melayu Tahun 6 dengan pencapaian cemerlang seperti berikut:
                        </p>

                        <!-- Score Breakdown Table -->
                        <div class="grid grid-cols-3 gap-2 max-w-md mx-auto my-5">
                            <div class="bg-sky-50 border border-sky-200 p-2.5 rounded-xl text-center">
                                <div class="text-[10px] font-bold text-sky-700 uppercase">Level 1</div>
                                <div class="text-lg font-extrabold text-sky-900">${state.levelScores[1]} / 10</div>
                                <div class="text-[10px] text-sky-600 font-semibold">Pilihan Jawapan</div>
                            </div>
                            <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-center">
                                <div class="text-[10px] font-bold text-emerald-700 uppercase">Level 2</div>
                                <div class="text-lg font-extrabold text-emerald-900">${state.levelScores[2]} / 10</div>
                                <div class="text-[10px] text-emerald-600 font-semibold">Ejaan Kosa Kata</div>
                            </div>
                            <div class="bg-purple-50 border border-purple-200 p-2.5 rounded-xl text-center">
                                <div class="text-[10px] font-bold text-purple-700 uppercase">Level 3</div>
                                <div class="text-lg font-extrabold text-purple-900">${state.levelScores[3]} / 10</div>
                                <div class="text-[10px] text-purple-600 font-semibold">Lengkapkan Ayat</div>
                            </div>
                        </div>

                        <!-- Overall Summary Badge -->
                        <div class="bg-amber-100 border border-amber-300 rounded-xl p-3 inline-block max-w-xs mx-auto mb-4">
                            <span class="text-xs font-bold text-amber-900">Jumlah Skor Keseluruhan: </span>
                            <span class="text-lg font-extrabold text-indigo-800 ml-1">${totalScore} / 30 (${totalPct}%)</span>
                        </div>

                        <!-- Date & Signature Footer -->
                        <div class="mt-4 pt-4 border-t border-slate-200 flex justify-between items-end text-left">
                            <div>
                                <p class="text-[10px] text-slate-400 font-semibold">Tarikh Dikeluarkan:</p>
                                <p class="text-xs font-bold text-slate-700">${dateStr}</p>
                            </div>
                            <div class="text-right">
                                <div class="inline-block border-b-2 border-slate-400 px-6 py-1 text-xs font-bold text-indigo-900">
                                    Modul Kosa Kata Tahun 6
                                </div>
                                <p class="text-[10px] text-slate-400 font-semibold mt-0.5">Pengesahan Aplikasi</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function downloadCertificatePNG() {
            const printArea = document.getElementById('certificate-print-area');
            const btn = document.getElementById('btn-download-png');
            if (!printArea) return;
            
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menjana PNG...';
            }

            const cleanName = (state.studentName || 'Murid').replace(/[^a-zA-Z0-9]/g, '_');

            // Save original inline style values
            const originalWidth = printArea.style.width;
            const originalMaxWidth = printArea.style.maxWidth;
            
            // Temporarily lock element width to optimal certificate dimensions during rendering
            // This guarantees 100% identical typography, grid alignment, and spacing regardless of screen width
            printArea.style.width = "700px";
            printArea.style.maxWidth = "700px";

            const generate = () => {
                if (typeof html2canvas !== 'undefined') {
                    html2canvas(printArea, {
                        scale: 3, // High resolution capture
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff'
                    }).then(canvas => {
                        const image = canvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        link.download = `Sijil_Pencapaian_${cleanName}.png`;
                        link.href = image;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        printArea.style.width = originalWidth;
                        printArea.style.maxWidth = originalMaxWidth;
                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fa-solid fa-file-image"></i> Muat Turun PNG';
                        }
                    }).catch(err => {
                        console.error('Pengeluaran PNG gagal:', err);
                        printArea.style.width = originalWidth;
                        printArea.style.maxWidth = originalMaxWidth;
                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fa-solid fa-file-image"></i> Muat Turun PNG';
                        }
                    });
                } else {
                    printArea.style.width = originalWidth;
                    printArea.style.maxWidth = originalMaxWidth;
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fa-solid fa-file-image"></i> Muat Turun PNG';
                    }
                }
            };

            // Ensure Google Fonts are fully rendered before snapshotting
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(generate);
            } else {
                setTimeout(generate, 300);
            }
        }

        function closeCertificateModal() {
            document.getElementById('certificate-modal-wrapper').classList.add('hidden');
        }

        // Initial setup on window load
        window.onload = function() {
            if (!state.studentName) {
                renderLoginScreen();
            } else {
                renderMainMenu();
            }
        };
    </script>
</body>
</html>
