<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年级道德教育 - 礼让感受收集瓶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #fffbeb; }
        .jar-shape {
            border: 5px solid #f43f5e;
            border-top: 10px solid #fb7185;
            border-radius: 20px 20px 50px 50px;
            background: rgba(255, 241, 242, 0.7);
            box-shadow: inset 0 0 20px rgba(244, 63, 94, 0.15), 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="p-6 flex justify-center items-center min-h-screen">

    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl p-6 border-4 border-pink-300">
        <!-- 头部标题 -->
        <div class="text-center mb-6">
            <span class="bg-pink-100 text-pink-700 text-xs font-black px-4 py-1.5 rounded-full border border-pink-300">
                💖 学习标准 14.4：表达表现礼让行为的感受
            </span>
            <h3 class="text-2xl font-black text-rose-900 mt-2">我的“社区礼让与感受”正能量收集瓶</h3>
            <p class="text-slate-600 text-xs font-bold mt-1">第一步：点击社区礼让行为 ➔ 第二步：点击你的内心感受 ➔ 收集正能量卡片！</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            
            <!-- 左侧：第一步 & 第二步 选择区 -->
            <div class="space-y-4 md:col-span-2">
                
                <!-- 步骤 1：选择社区礼让行为 -->
                <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-300">
                    <h4 class="font-black text-amber-900 text-xs uppercase mb-2 flex items-center">
                        <span class="bg-amber-400 text-amber-950 w-5 h-5 rounded-full inline-flex items-center justify-center text-xs mr-2">1</span>
                        选择在社区可以做出的礼让行为：
                    </h4>
                    <div class="flex flex-wrap gap-2" id="action-pool">
                        <button onclick="selectAction(this, '🚌 巴士上主动给老人让座')" class="action-btn px-3 py-2 rounded-xl border-2 border-amber-300 bg-white text-amber-900 font-bold text-xs shadow-sm hover:bg-amber-200 transition">🚌 巴士上主动给老人让座</button>
                        <button onclick="selectAction(this, '🎠 公园秋千按次序排队玩')" class="action-btn px-3 py-2 rounded-xl border-2 border-amber-300 bg-white text-amber-900 font-bold text-xs shadow-sm hover:bg-amber-200 transition">🎠 公园秋千按次序排队玩</button>
                        <button onclick="selectAction(this, '🏬 进电梯时主动挡门让邻居先进')" class="action-btn px-3 py-2 rounded-xl border-2 border-amber-300 bg-white text-amber-900 font-bold text-xs shadow-sm hover:bg-amber-200 transition">🏬 进电梯时主动挡门让邻居先进</button>
                        <button onclick="selectAction(this, '🏸 羽毛球场打完后让给等待的邻居')" class="action-btn px-3 py-2 rounded-xl border-2 border-amber-300 bg-white text-amber-900 font-bold text-xs shadow-sm hover:bg-amber-200 transition">🏸 羽毛球场打完后让给等待的邻居</button>
                        <button onclick="selectAction(this, '🍲 社区食堂排队买饭不插队')" class="action-btn px-3 py-2 rounded-xl border-2 border-amber-300 bg-white text-amber-900 font-bold text-xs shadow-sm hover:bg-amber-200 transition">🍲 社区食堂排队买饭不插队</button>
                    </div>
                </div>

                <!-- 步骤 2：选择感受 -->
                <div class="bg-rose-50 p-4 rounded-2xl border-2 border-rose-300 opacity-50 pointer-events-none transition-all" id="feeling-box">
                    <h4 class="font-black text-rose-900 text-xs uppercase mb-2 flex items-center">
                        <span class="bg-rose-400 text-rose-950 w-5 h-5 rounded-full inline-flex items-center justify-center text-xs mr-2">2</span>
                        做了这个礼让行为后，你的感受是：
                    </h4>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="addCombo('😃 开心愉快', 'bg-yellow-100 text-yellow-900 border-yellow-400')" class="px-3 py-2 rounded-xl border-2 border-rose-300 bg-white text-rose-900 font-bold text-xs shadow-sm hover:bg-rose-200 transition">😃 开心愉快</button>
                        <button onclick="addCombo('🏆 为自己自豪', 'bg-amber-100 text-amber-900 border-amber-400')" class="px-3 py-2 rounded-xl border-2 border-rose-300 bg-white text-rose-900 font-bold text-xs shadow-sm hover:bg-rose-200 transition">🏆 为自己自豪</button>
                        <button onclick="addCombo('🌸 感到内心温馨', 'bg-pink-100 text-pink-900 border-pink-400')" class="px-3 py-2 rounded-xl border-2 border-rose-300 bg-white text-rose-900 font-bold text-xs shadow-sm hover:bg-rose-200 transition">🌸 感到内心温馨</button>
                        <button onclick="addCombo('😌 心里很踏实', 'bg-teal-100 text-teal-900 border-teal-400')" class="px-3 py-2 rounded-xl border-2 border-rose-300 bg-white text-rose-900 font-bold text-xs shadow-sm hover:bg-rose-200 transition">😌 心里很踏实</button>
                        <button onclick="addCombo('🤝 觉得邻里关系更融洽', 'bg-purple-100 text-purple-900 border-purple-400')" class="px-3 py-2 rounded-xl border-2 border-rose-300 bg-white text-rose-900 font-bold text-xs shadow-sm hover:bg-rose-200 transition">🤝 觉得邻里关系更融洽</button>
                    </div>
                </div>

                <!-- 提示区域 -->
                <div class="text-xs text-slate-500 font-semibold px-2" id="hint-text">
                    💡 请先在“步骤 1”中选择一个礼让行为。
                </div>
            </div>

            <!-- 右侧：收集瓶展示 -->
            <div class="flex flex-col items-center">
                <div class="w-full h-80 jar-shape p-4 relative flex flex-col-reverse items-center overflow-y-auto space-y-2 space-y-reverse" id="jar-container">
                    <div class="text-xs text-rose-400 font-bold my-auto text-center" id="jar-placeholder">
                        <i class="fa-solid fa-heart-circle-plus text-3xl mb-2 block animate-bounce"></i>
                        瓶子空空的...<br>完成左侧选择<br>把礼让能量装进来！
                    </div>
                </div>

                <button onclick="clearJar()" class="mt-4 text-xs font-bold text-rose-600 hover:text-rose-800 transition flex items-center">
                    <i class="fa-solid fa-rotate-left mr-1"></i> 清空收集瓶重来
                </button>
            </div>

        </div>
    </div>

    <script>
        let selectedActionText = "";
        let count = 0;

        function selectAction(btn, actionText) {
            // 清除其他按钮高亮
            document.querySelectorAll('.action-btn').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-amber-950');
                b.classList.add('bg-white', 'text-amber-900');
            });
            // 高亮当前按钮
            btn.classList.remove('bg-white', 'text-amber-900');
            btn.classList.add('bg-amber-400', 'text-amber-950');

            selectedActionText = actionText;

            // 解锁第二步
            const feelingBox = document.getElementById('feeling-box');
            feelingBox.classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('hint-text').innerText = "💡 太棒了！现在请在“步骤 2”中选择你做这件事时的感受。";
        }

        function addCombo(feelingText, colorStyle) {
            if (!selectedActionText) return;
            if (count >= 4) {
                alert("收集瓶已经装得满满的啦！点击下方“清空”可以重新收集哦！");
                return;
            }

            const jar = document.getElementById('jar-container');
            const placeholder = document.getElementById('jar-placeholder');
            if (placeholder) placeholder.style.display = 'none';

            // 创建能量卡片
            const card = document.createElement('div');
            card.className = `w-full p-2.5 rounded-2xl border-2 text-xs font-black shadow-md transition-all duration-300 animate-fade-in ${colorStyle}`;
            card.innerHTML = `
                <div class="text-slate-800 font-extrabold truncate"><i class="fa-solid fa-hand-holding-heart mr-1"></i>${selectedActionText}</div>
                <div class="text-right text-rose-700 font-black mt-1">➔ 感受：${feelingText}</div>
            `;

            jar.appendChild(card);
            count++;

            // 放花炮庆祝
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });

            // 重置选中的 action
            selectedActionText = "";
            document.querySelectorAll('.action-btn').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-amber-950');
                b.classList.add('bg-white', 'text-amber-900');
            });
            document.getElementById('feeling-box').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('hint-text').innerText = "💡 成功装入瓶中！请继续选择下一个礼让行为。";
        }

        function clearJar() {
            document.getElementById('jar-container').innerHTML = `
                <div class="text-xs text-rose-400 font-bold my-auto text-center" id="jar-placeholder">
                    <i class="fa-solid fa-heart-circle-plus text-3xl mb-2 block animate-bounce"></i>
                    瓶子空空的...<br>完成左侧选择<br>把礼让能量装进来！
                </div>`;
            count = 0;
            selectedActionText = "";
            document.querySelectorAll('.action-btn').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-amber-950');
                b.classList.add('bg-white', 'text-amber-900');
            });
            document.getElementById('feeling-box').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('hint-text').innerText = "💡 请先在“步骤 1”中选择一个礼让行为。";
        }
    </script>
</body>
</html>
