        const playSoundEffect = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'flip') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch (e) {
                // Audio Context fallback silent handle
            }
        };

        const speakText = (text, lang = 'ms-MY') => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85; // slightly slower for young learners
                window.speechSynthesis.speak(utterance);
            }
        };

                setTimeout(() => setToastMessage(null), 3000);

                        spread: 80,
                        origin: { y: 0.5 }

                    setHasAutoOpenedCert(true);

                        setShowCertificateModal(true);
                        playSoundEffect('correct');
                        triggerConfetti();

                    </header>

                    {/* Main Content Body */}

`📜 *SIJIL PENCAPAIAN PENULISAN BAHASA MELAYU*

-------------------------------------------
👤 *Nama Murid:* ${nameText}

⭐ *Jumlah Bintang Diperoleh:* ${score} Bintang

Terima kasih Cikgu! 🎉`;

                // Copy using textarea fallback to support iframe restrictions

                setMalayItems(shuffledM);

                setSelectedMalay(null);
                setSelectedChinese(null);
                setMatchedIds([]);
                setIsCompleted(false);
            };

            const handleMalayClick = (item) => {
                if (matchedIds.includes(item.id)) return;
                setSelectedMalay(item);
                checkMatch(item, selectedChinese);

            const handleChineseClick = (item) => {
                if (matchedIds.includes(item.id)) return;
                setSelectedChinese(item);
                checkMatch(selectedMalay, item);
            };

            const checkMatch = (mItem, cItem) => {
                if (mItem && cItem) {
                    if (mItem.id === cItem.id) {
                        // Correct match
                        playSoundEffect('correct');
                        const newMatched = [...matchedIds, mItem.id];
                        setMatchedIds(newMatched);
                        setSelectedMalay(null);
                        setSelectedChinese(null);
                        setScore((s) => s + 5);

                            setIsCompleted(true);
                            triggerConfetti();
                            showToast("Hebat! Anda telah berjaya memadankan semua perkataan! 🎉");
                            if (onComplete) onComplete();

                            setSelectedMalay(null);
                            setSelectedChinese(null);

                    const userVal = (userInputs[key] || '').trim().toLowerCase();
                    const validValids = CORRECT_ANSWERS[key].map(v => v.toLowerCase());
                    const isRight = validValids.includes(userVal);
                    newResults[key] = isRight;
                    if (isRight) correctCount++;
                });

                setResults(newResults);
                setSubmitted(true);

                if (correctCount === 9) {
                    playSoundEffect('correct');
                    triggerConfetti();
                    showToast("Syabas! Karangan lengkap dan semua 9 jawapan ditaip dengan betul! 🎉");
                } else {
                    playSoundEffect('correct');
                    showToast(`Anda telah melengkapkan ${correctCount}/9 tempat kosong dengan betul! Sila semak semula.`);
                }

                if (onComplete) {
                    onComplete(correctCount, 9);
                }
            };

            const fillAllAnswers = () => {
                setUserInputs({
                    p1: "merasmikan",
                    p2: "mengambil bahagian / menyertai",
                    p3: "berlumba lari",
                    p4: "melontar peluru",
                    p5: "mencatat",
                    p6: "menyaksikan",
                    p7: "bersorak-sorai",
                    p8: "mengumumkan keputusan",
                    p9: "menyampaikan pingat"
                });
                setSubmitted(false);
                showToast("Semua jawapan telah diisikan sebagai panduan!");
            };

            const copyEssayToClipboard = () => {
                const getW = (key) => userInputs[key] || "_______";
                const text = `HARI SUKAN SEKOLAH SAYA\n\nPada hari Sabtu yang lalu, Sekolah Jenis Kebangsaan (Cina) kami telah mengadakan Kejohanan Sukan Tahunan di padang sekolah. Suasana pada hari tersebut sungguh meriah.\n\nMajlis dimulakan apabila Guru Besar dijemput untuk ${getW('p1')} kejohanan sukan tersebut. Semua murid bersiap sedia untuk ${getW('p2')} dalam pelbagai acara yang dipertandingkan.\n\nDi balapan, para peserta ${getW('p3')} dengan pantas untuk merebut gelaran johan. Di padang pula, peserta acara padang ${getW('p4')} dengan penuh semangat.\n\nPara guru bertugas sibuk ${getW('p5')} masa dan markah pertandingan. Manakala ibu bapa gembira ${getW('p6')} aksi anak-anak mereka dari khemah penonton. Suasana menjadi gemuruh apabila penonton ${getW('p7')} untuk memberi sokongan.\n\nSebelum majlis tamat, juruacara ${getW('p8')} rasmi pertandingan. Tetamu kehormat pula dijemput untuk ${getW('p9')} kepada para pemenang.\n\nSukan tahunan ini berakhir dengan jayanya dan kami pulang ke rumah dengan gembira.`;

                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("Teks karangan telah disalin ke papan klip! 📋");
                } catch (e) {
                    showToast("Gagal menyalin. Sila salin secara manual.");
                }
                document.body.removeChild(textArea);
            };

            const renderInput = (key, placeholder) => {
                const isCorrect = results[key];
                let inputBgClass = "bg-white border-amber-300 text-slate-800 focus:border-sky-500 focus:ring-2 focus:ring-sky-200";
                
                if (submitted) {
                    if (isCorrect) {
                        inputBgClass = "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold";
                    } else {
                        inputBgClass = "bg-rose-100 border-rose-500 text-rose-900 font-bold";
                    }
                }

                return (
                    <span className="inline-block relative my-1 mx-1">
                        <input
                            type="text"
                            value={userInputs[key]}
                            onFocus={() => setActiveInput(key)}
                            onChange={(e) => handleInputChange(key, e.target.value)}
                            placeholder={placeholder}
                            className={`px-3 py-1 text-sm font-bold border-2 rounded-xl outline-none transition-all shadow-sm ${inputBgClass} ${activeInput === key ? 'ring-2 ring-sky-400 border-sky-500' : ''}`}
                            style={{ minWidth: '160px', width: 'auto' }}
                        />
                        {submitted && !isCorrect && (
                            <span className="block text-[11px] font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200 mt-0.5">
                                Betul: {CORRECT_ANSWERS[key][0]}
                            </span>
                        )}
                    </span>
                );
            };

            return (
                <div className="max-w-4xl mx-auto glass-panel p-6 md:p-8 rounded-3xl shadow-lg border border-white">
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <span>✍️</span> Modul Lengkapkan Karangan (Taip Jawapan)
                            </h2>
                            <p className="text-xs text-slate-500">
                                Murid perlu menaip kata kerja Bahasa Melayu yang betul di dalam petak kosong untuk melengkapkan karangan Hari Sukan.
                            </p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button
                                onClick={fillAllAnswers}
                                className="bg-sky-100 hover:bg-sky-200 text-sky-700 text-xs font-bold px-3 py-2 rounded-xl border border-sky-200 transition-colors flex items-center gap-1.5"
                                title="Bantu isi semua tempat kosong"
                            >
                                <i className="fa-solid fa-lightbulb text-amber-500"></i> Petunjuk Jawapan
                            </button>
                            <button
                                onClick={copyEssayToClipboard}
                                className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md transition-all flex items-center gap-1.5"
                            >
                                <i className="fa-regular fa-copy"></i> Salin Karangan
                            </button>
                        </div>
                    </div>

                    {/* Word Bank / Pilihan Perkataan */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6">
                        <div className="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-2 flex items-center justify-between">
                            <span><i className="fa-solid fa-box-archive text-amber-500 mr-1"></i> Bank Kosa Kata Hari Sukan (Klik untuk isi petak aktif)</span>
                            <span className="text-[11px] font-normal text-slate-400">Petak aktif: <strong className="text-sky-600">{activeInput ? `Petak ${activeInput.replace('p', '')}` : 'Tiada'}</strong></span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {wordList.map((word) => (
                                <button
                                    key={word}
                                    onClick={() => handleWordClick(word)}
                                    className="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-xs font-bold px-3 py-1.5 rounded-xl shadow-xs transition-transform active:scale-95 flex items-center gap-1"
                                >
                                    <span>{word}</span>
                                    <i className="fa-solid fa-plus text-[10px] text-amber-600"></i>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Interactive Essay Paragraphs */}
                    <div className="bg-amber-50/60 border border-amber-200/80 p-6 md:p-8 rounded-2xl font-serif leading-relaxed text-slate-800 text-base space-y-5 shadow-inner">
                        <h3 className="text-center font-sans font-extrabold text-xl text-slate-900 uppercase tracking-wide border-b border-amber-200 pb-2">
                            HARI SUKAN SEKOLAH SAYA
                        </h3>

                        <p className="indent-8 leading-loose">
                            Pada hari Sabtu yang lalu, sekolah kami telah mengadakan Kejohanan Sukan Tahunan di padang sekolah. Suasana pada pagi itu sungguh meriah dengan hiasan bendera berwarna-warni.
                        </p>

                        <p className="indent-8 leading-loose">
                            Majlis dimulakan apabila Guru Besar dijemput untuk{' '}
                            {renderInput('p1', '1. taip jawapan...')}
                            {' '}kejohanan tersebut. Semua murid teruja untuk{' '}
                            {renderInput('p2', '2. taip jawapan...')}
                            {' '}dalam pelbagai acara sukan.
                        </p>

                        <p className="indent-8 leading-loose">
                            Acara sukan bermula tidak lama kemudian. Para peserta{' '}
                            {renderInput('p3', '3. taip jawapan...')}
                            {' '}di balapan dengan pantas sekali. Di kawasan padang pula, peserta acara padang bersungguh-sungguh{' '}
                            {renderInput('p4', '4. taip jawapan...')}
                            {' '}demi memungut mata bagi rumah sukan masing-masing.
                        </p>

                        <p className="indent-8 leading-loose">
                            Sementara itu, guru pencatat sibuk{' '}
                            {renderInput('p5', '5. taip jawapan...')}
                            {' '}keputusan pertandingan. Ramai ibu bapa hadir untuk{' '}
                            {renderInput('p6', '6. taip jawapan...')}
                            {' '}anak-anak mereka beraksi. Suasana menjadi riuh-rendah apabila para penonton{' '}
                            {renderInput('p7', '7. taip jawapan...')}
                            {' '}untuk memberi sokongan.
                        </p>

                        <p className="indent-8 leading-loose">
                            Sebelum majlis berlabuh tirai, juruacara pun{' '}
                            {renderInput('p8', '8. taip jawapan...')}
                            {' '}keseluruhan. Tetamu kehormat dijemput ke pentas untuk{' '}
                            {renderInput('p9', '9. taip jawapan...')}
                            {' '}kepada para pemenang. Kejohanan sukan ini berakhir dengan jayanya.
                        </p>
                    </div>

                    {/* Submit Action Bar */}
                    <div className="mt-6 flex flex-col md:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-200">
                        <div className="text-xs text-slate-500 font-medium">
                            {submitted ? (
                                <span className="font-bold text-slate-700">
                                    Keputusan: {Object.values(results).filter(Boolean).length} / 9 Betul
                                </span>
                            ) : (
                                "Taip jawapan anda di tempat kosong dan tekan butang 'Semak Karangan Saya'."
                            )}
                        </div>
                        <button
                            onClick={checkEssay}
                            className="w-full md:w-auto px-8 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-2xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2"
                        >
                            <i className="fa-solid fa-circle-check"></i> Semak Karangan Saya
                        </button>
                    </div>
                </div>
            );
        }

        function DictionaryTab({ showToast }) {
            const [searchTerm, setSearchTerm] = useState('');

            const filteredVocab = VOCAB_LIST.filter(
                (item) =>
                    item.malay.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    item.chinese.includes(searchTerm) ||
                    item.pinyin.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="max-w-4xl mx-auto glass-panel p-6 md:p-8 rounded-3xl shadow-lg border border-white">
                    <div className="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">📚 Senarai Kosa Kata Penulisan</h2>
                            <p className="text-xs text-slate-500">Rujukan pantas bagi 9 kosa kata utama Hari Sukan Bahasa Melayu.</p>
                        </div>
                        {/* Search Bar */}
                        <div className="relative w-full md:w-64">
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input
                                type="text"
                                placeholder="Cari perkataan..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full pl-9 pr-4 py-2 bg-white rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-sky-500"
                            />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredVocab.map((item) => (
                            <div key={item.id} className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-2xl">{item.icon}</span>
                                        <span className={`text-[10px] font-bold text-white px-2.5 py-0.5 rounded-full ${item.badgeColor}`}>
                                            {item.category}
                                        </span>
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <span>{item.id}. {item.malay}</span>
                                        <button
                                            onClick={() => speakText(item.malay, 'ms-MY')}
                                            className="text-sky-500 hover:text-sky-700 text-xs"
                                            title="Sebut"
                                        >
                                            <i className="fa-solid fa-volume-high"></i>
                                        </button>
                                    </h3>
                                    <div className="text-amber-600 font-bold text-sm mt-0.5">
                                        {item.chinese} <span className="text-slate-400 font-normal text-xs">({item.pinyin})</span>
                                    </div>
                                    <p className="text-slate-500 text-xs mt-2 font-medium">
                                        {item.meaning}
                                    </p>
                                </div>

                                <div className="mt-4 pt-3 border-t border-slate-100 bg-slate-50/60 -mx-5 -mb-5 p-4 rounded-b-2xl">
                                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Contoh Ayat:</div>
                                    <p className="text-xs text-slate-700 italic">"{item.sentence}"</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
