<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Menaip Isi Karangan Hari Raya Aidilfitri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            gold: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4fbf7;
            background-image: radial-gradient(#dcfce7 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .heading-font {
            font-family: 'Fredoka', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <div id="app" class="flex-grow flex flex-col max-w-4xl mx-auto w-full p-4 md:p-6">

        <!-- Name Input Screen Modal -->
        <div v-if="!isNameEntered" class="my-auto py-12 flex items-center justify-center">
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-emerald-100 shadow-2xl max-w-md w-full text-center space-y-6">
                <div class="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-slate-800 heading-font">Selamat Datang!</h2>
                    <p class="text-sm text-slate-500 mt-1">Sila masukkan nama anda sebelum memulakan Latihan Menaip Isi Karangan.</p>
                </div>
                <form @submit.prevent="masukAplikasi" class="space-y-4">
                    <div>
                        <input type="text" 
                               v-model="studentName" 
                               placeholder="Taip nama anda di sini..." 
                               class="w-full p-4 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center font-semibold text-lg"
                               required />
                    </div>
                    <button type="submit" 
                            :disabled="!studentName.trim()"
                            :class="[
                                'w-full py-4 rounded-2xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 text-base',
                                studentName.trim() ? 'bg-emerald-600 hover:bg-emerald-700 cursor-pointer' : 'bg-slate-300 cursor-not-allowed opacity-60'
                            ]">
                        <span>Mula Latihan</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Application Screen -->
        <template v-else>
            <!-- Header -->
            <header class="bg-gradient-to-r from-emerald-700 via-teal-700 to-green-800 text-white rounded-3xl p-6 mb-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 opacity-15 text-9xl">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-amber-400 text-emerald-900 rounded-2xl flex items-center justify-center text-3xl shadow-lg font-bold border-2 border-amber-200 shrink-0">
                            <i class="fa-solid fa-keyboard"></i>
                        </div>
                        <div>
                            <span class="bg-amber-400/30 text-amber-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Latihan Menaip BM Tahun 5</span>
                            <h1 class="text-2xl md:text-3xl font-bold heading-font text-white mt-1">Latihan Isi Karangan Hari Raya Aidilfitri</h1>
                            <p class="text-emerald-100 text-sm mt-0.5">Taip jawapan Bahasa Melayu berdasarkan panduan Bahasa Cina (华文翻译)</p>
                        </div>
                    </div>
                    <!-- Student Info Badge -->
                    <div class="bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/20 flex items-center gap-3 shrink-0">
                        <i class="fa-solid fa-id-card text-amber-300 text-xl"></i>
                        <div class="text-left">
                            <p class="text-xs text-emerald-200 uppercase tracking-wider font-semibold">Nama Murid</p>
                            <p class="font-bold text-white text-sm md:text-base heading-font">{{ studentName }}</p>
                        </div>
                    </div>
                </div>
            </header>

            <main class="space-y-6">
                <div class="bg-white p-6 md:p-8 rounded-3xl border border-emerald-100 shadow-md">
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-2">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 heading-font flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-emerald-600"></i>
                                Modul Latihan Menaip
                            </h2>
                            <p class="text-xs text-slate-500">Sila taipkan isi karangan yang betul (huruf besar/kecil dan simbol diabaikan semasa semakan).</p>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div v-for="(item, index) in items" :key="index" class="p-4 rounded-2xl border transition"
                             :class="{
                                 'bg-slate-50 border-slate-200': item.status === null,
                                 'bg-emerald-50 border-emerald-300': item.status === 'correct',
                                 'bg-amber-50 border-amber-300': item.status === 'partial',
                                 'bg-rose-50 border-rose-300': item.status === 'wrong'
                             }">
                            
                            <!-- Question Header -->
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-2">
                                <span class="font-bold text-emerald-800 text-base md:text-lg heading-font">
                                    {{ item.title }}
                                </span>
                                <span class="text-slate-600 text-sm font-medium bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-sm inline-block">
                                    <i class="fa-solid fa-language text-emerald-600 mr-1"></i> {{ item.zh }}
                                </span>
                            </div>

                            <!-- Typing Area -->
                            <div class="mt-3">
                                <input type="text" 
                                       v-model="item.userAnswer" 
                                       :placeholder="'Taip ' + item.title + ' di sini...'"
                                       class="w-full p-3 md:p-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm md:text-base font-medium transition bg-white" />
                            </div>

                            <!-- Feedback -->
                            <div class="mt-2.5 flex flex-wrap items-center justify-end gap-2 text-xs">
                                <span v-if="item.status === 'correct'" class="text-emerald-700 font-bold flex items-center gap-1">
                                    <i class="fa-solid fa-circle-check"></i> Tepat sekali!
                                </span>
                                <span v-else-if="item.status === 'partial'" class="text-amber-700 font-bold flex items-center gap-1">
                                    <i class="fa-solid fa-triangle-exclamation"></i> Tepat (Semak ejaan)
                                </span>
                                <span v-else-if="item.status === 'wrong'" class="text-rose-700 font-bold flex items-center gap-1">
                                    <i class="fa-solid fa-circle-xmark"></i> Sila cuba lagi
                                </span>
                            </div>

                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <button @click="semakJawapan" 
                                :disabled="!isAllAnswered"
                                :class="[
                                    'w-full sm:w-auto font-bold px-8 py-3.5 rounded-2xl shadow-md transition flex items-center justify-center gap-2',
                                    isAllAnswered ? 'bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer' : 'bg-slate-300 text-slate-400 cursor-not-allowed opacity-60'
                                ]">
                            <i class="fa-solid fa-check-double"></i>
                            <span>Semak Semua Jawapan</span>
                        </button>

                        <button @click="resetForm" class="w-full sm:w-auto bg-slate-200 text-slate-700 font-bold px-6 py-3.5 rounded-2xl hover:bg-slate-300 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Padam & Mulakan Semula</span>
                        </button>
                    </div>

                    <!-- Complete Essay Preview Section -->
                    <div v-if="isCompleted" class="mt-8 p-6 bg-gradient-to-br from-emerald-50 to-teal-50 rounded-3xl border border-emerald-200 shadow-inner">
                        <h3 class="text-lg font-bold text-emerald-900 heading-font mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-file-signature text-amber-500"></i>
                            Karangan Lengkap Hari Raya Aidilfitri
                        </h3>
                        <p class="text-slate-700 text-sm md:text-base leading-relaxed bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm">
                            {{ items.map(i => i.userAnswer || i.target).join(' ') }}
                        </p>
                    </div>

                    <!-- Sijil Penyertaan Section -->
                    <div id="sijil-container" v-if="isCompleted" class="mt-8 p-6 md:p-8 bg-amber-50 rounded-3xl border-4 border-double border-amber-400 text-center relative overflow-hidden shadow-xl">

                        <div class="relative z-10 space-y-4">
                            <div class="inline-block p-3 bg-amber-400 text-emerald-950 rounded-full shadow-lg">
                                <i class="fa-solid fa-award text-4xl md:text-5xl"></i>
                            </div>

                            <p class="text-xs uppercase tracking-widest font-bold text-amber-800">Modul Pembelajaran Bahasa Melayu Tahun 5</p>
                            
                            <h3 class="text-2xl md:text-4xl font-extrabold heading-font text-emerald-900 uppercase tracking-wide">
                                Sijil Penyertaan
                            </h3>

                            <p class="text-slate-600 text-sm md:text-base italic">Dengan ini disahkan bahawa</p>

                            <div class="py-2">
                                <span class="text-2xl md:text-3xl font-bold text-emerald-700 heading-font border-b-2 border-amber-400 pb-1 px-6 inline-block">
                                    {{ studentName }}
                                </span>
                            </div>

                            <p class="text-slate-700 text-sm md:text-base max-w-xl mx-auto leading-relaxed">
                                telah berjaya menyelesaikan **Latihan Menaip Isi Karangan Hari Raya Aidilfitri** dengan penuh tekun dan cemerlang.
                            </p>

                            <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-4 text-xs text-slate-500 border-t border-amber-200 max-w-md mx-auto">
                                <div>
                                    <span class="font-semibold block text-slate-700">Tarikh Penyelesaian:</span>
                                    <span>{{ tarikhPenyelesaian }}</span>
                                </div>
                                <div class="hidden sm:block text-amber-300">•</div>
                                <div>
                                    <span class="font-semibold block text-slate-700">Status:</span>
                                    <span class="text-emerald-600 font-bold">Lulus & Tamat</span>
                                </div>
                            </div>

                            <div class="pt-2" data-html2canvas-ignore="true">
                                <button @click="muatTurunSijil" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-2.5 rounded-xl shadow transition text-xs md:text-sm inline-flex items-center gap-2 cursor-pointer">
                                    <i class="fa-solid fa-download"></i>
                                    <span>Muat Turun Sijil (PDF)</span>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </template>

        <footer class="mt-auto pt-6 text-center text-xs text-slate-400">
            <p>© Modul Pembelajaran Bahasa Melayu Tahun 5 • Latihan Menaip Isi Karangan Hari Raya</p>
        </footer>

    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    studentName: '',
                    isNameEntered: false,
                    isCompleted: false,
                    tarikhPenyelesaian: '',
                    items: [
                        {
                            title: 'Pendahuluan',
                            zh: '开头：开斋节 & 去叔叔家参加开放门户',
                            target: 'Hari Raya Aidilfitri & ke rumah terbuka di rumah pak cik saya.',
                            userAnswer: '',
                            status: null,
                            showHint: false
                        },
                        {
                            title: 'Isi 1',
                            zh: '内容 1：穿传统服装（马来服装和 baju kurung）',
                            target: 'memakai pakaian tradisional, baju Melayu dan baju kurung',
                            userAnswer: '',
                            status: null,
                            showHint: false
                        },
                        {
                            title: 'Isi 2',
                            zh: '内容 2：享用美味的食物',
                            target: 'Mengambil makanan yang lazat.',
                            userAnswer: '',
                            status: null,
                            showHint: false
                        },
                        {
                            title: 'Isi 3',
                            zh: '内容 3：和亲戚聊天 & 玩烟花',
                            target: 'Berbual-bual dengan saudara saya & bermain bunga api.',
                            userAnswer: '',
                            status: null,
                            showHint: false
                        },
                        {
                            title: 'Isi 4',
                            zh: '内容 4：拍照',
                            target: 'Mengambil gambar.',
                            userAnswer: '',
                            status: null,
                            showHint: false
                        },
                        {
                            title: 'Penutup',
                            zh: '结尾：我感到很高兴',
                            target: 'Saya berasa gembira.',
                            userAnswer: '',
                            status: null,
                            showHint: false
                        }
                    ]
                }
            },
            computed: {
                isAllAnswered() {
                    return this.items.every(item => item.userAnswer && item.userAnswer.trim().length > 0);
                }
            },
            methods: {
                masukAplikasi() {
                    if (this.studentName.trim()) {
                        this.isNameEntered = true;
                    }
                },
                normalizeText(str) {
                    if (!str) return '';
                    return str
                        .toLowerCase()
                        .replace(/\bdan\b/g, '') // Mengabaikan perkataan 'dan' / '&' supaya lebih fleksibel
                        .replace(/&/g, '')
                        .replace(/[^a-z0-9]/g, '') // Membuang semua simbol, tanda baca dan ruang kosong
                        .trim();
                },
                semakJawapan() {
                    let allCorrect = true;
                    this.items.forEach(item => {
                        const userNorm = this.normalizeText(item.userAnswer);
                        const targetNorm = this.normalizeText(item.target);

                        if (!userNorm) {
                            item.status = 'wrong';
                            allCorrect = false;
                        } else if (userNorm === targetNorm) {
                            item.status = 'correct';
                        } else if (userNorm.length > 5 && (targetNorm.includes(userNorm) || userNorm.includes(targetNorm))) {
                            item.status = 'partial';
                            allCorrect = false;
                        } else {
                            item.status = 'wrong';
                            allCorrect = false;
                        }
                    });
                    
                    const today = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    this.tarikhPenyelesaian = today.toLocaleDateString('ms-MY', options);
                    
                    this.isCompleted = true;
                },
                muatTurunSijil() {
                    const element = document.getElementById('sijil-container');
                    if (!element) return;
                    
                    const opt = {
                        margin:       0.2,
                        filename:     `Sijil_Penyertaan_${this.studentName.replace(/\s+/g, '_')}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { 
                            scale: 2, 
                            useCORS: true,
                            scrollY: 0,
                            scrollX: 0,
                            windowWidth: document.documentElement.offsetWidth
                        },
                        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(element).save();
                },
                resetForm() {
                    this.items.forEach(item => {
                        item.userAnswer = '';
                        item.status = null;
                        item.showHint = false;
                    });
                    this.isCompleted = false;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
